name: Temporary Phase 6 Sharp runtime finalize

on:
  push:
    branches:
      - codex/site-vnext-media-phase6

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-media-phase6
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply Sharp runtime contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          profiles = Path("packages/media-ingest/src/profiles.ts")
          text = profiles.read_text(encoding="utf-8")
          marker = 'export const canonicalRasterProfile = mediaIngestProfileSchema.parse({'
          block = '''export const diagramSvgProfile = mediaIngestProfileSchema.parse({\n  id: "diagram-svg-v1",\n  kind: "diagram_svg",\n  svg: { sanitize: true, allowScript: false, allowExternalReferences: false },\n});\n\n'''
          if block not in text:
              if marker not in text:
                  raise SystemExit("canonical profile marker missing")
              text = text.replace(marker, block + marker)
          profiles.write_text(text, encoding="utf-8", newline="\n")

          runtime = Path("packages/media-ingest/src/sharp-runtime.ts")
          text = runtime.read_text(encoding="utf-8")
          text = text.replace('import { isAbsolute, relative, resolve } from "node:path";', 'import { dirname, isAbsolute, relative, resolve } from "node:path";')
          text = text.replace('await mkdir(resolve(absolute, ".."), { recursive: true });', 'await mkdir(dirname(absolute), { recursive: true });')
          text = text.replace('  public async generate(input: Readonly<{\n    ingestResult: MediaIngestResult;', '  public async generate(input: Readonly<{\n    contentId: string;\n    ingestResult: MediaIngestResult;')
          dummy = 'contentId: "00000000-0000-4000-8000-000000000000",'
          if dummy not in text:
              raise SystemExit("dummy variant ContentId not found")
          text = text.replace(dummy, 'contentId: input.contentId,')
          if dummy in text:
              raise SystemExit("dummy variant ContentId remains after replacement")
          text = text.replace('      const path = await outputPath(this.root, "variants", input.ingestResult.semanticAssetId, objectSha, formatSpec.format);', '      const path = await outputPath(this.root, input.contentId, input.ingestResult.semanticAssetId, objectSha, formatSpec.format);')
          runtime.write_text(text, encoding="utf-8", newline="\n")

          stage = Path("packages/media-ingest/src/stage-order.test.ts")
          text = stage.read_text(encoding="utf-8")
          text = text.replace('    const variantGenerator = { generate: vi.fn(async (received: {\n      ingestResult: MediaIngestResult;', '    const variantGenerator = { generate: vi.fn(async (received: {\n      contentId: string;\n      ingestResult: MediaIngestResult;')
          text = text.replace('      order.push("variants");\n      expect(received.profileId).toBe("photo-hero-v1");', '      order.push("variants");\n      expect(received.contentId).toBe(request.target.contentId);\n      expect(received.profileId).toBe("photo-hero-v1");')
          stage.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Pin Sharp as direct media-ingest dependency
        run: npm install sharp@0.34.5 --workspace @xpotato/media-ingest --save-exact
      - name: Validate Sharp runtime
        run: |
          npx vitest run packages/media-ingest/src/profiles.test.ts packages/media-ingest/src/stage-order.test.ts packages/media-ingest/src/sharp-runtime.test.ts
          npm run typecheck --workspace @xpotato/media-ingest
          npm run test
          npm run typecheck
          npm run ci
          git diff --check
      - name: Commit runtime and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6-sharp-runtime-temporary.yml
          git add \
            packages/media-ingest/package.json \
            package-lock.json \
            packages/media-ingest/src/profiles.ts \
            packages/media-ingest/src/index.ts \
            packages/media-ingest/src/sharp-runtime.ts \
            packages/media-ingest/src/sharp-runtime.test.ts \
            packages/media-ingest/src/stage-order.test.ts
          git commit -m "feat: Phase 6 Sharp media processing runtimeを確定"
          git push origin HEAD:codex/site-vnext-media-phase6
