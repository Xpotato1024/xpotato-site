name: Article final draft preview (temporary, no deploy)
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'feat/article-structure-and-visual-guidance-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ARTICLE_PREVIEW_BROWSER: google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 && npm ci
      - name: Build final manuscript using the real site
        run: npx tsx scripts/article-concrete-preview.ts --composition-only
      - name: Render final manuscript PDF and verify
        run: node scripts/article-concrete-export.mjs --composition-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: article-final-draft-site-review
          path: .local/article-concrete/export/
          if-no-files-found: error
          retention-days: 7
