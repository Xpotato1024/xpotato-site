name: Editor Astro layout preview
on:
  pull_request:
    paths:
      - "content/articles/**"
      - "content/notes/**"
      - "content/projects/**"
      - "content/tools/**"
      - "content/pages/**"
      - ".github/workflows/editor-preview.yml"
      - "ops/authoring/editor-review-scope.*"
      - "ops/authoring/editor-astro-review.*"
permissions:
  contents: read
concurrency:
  group: editor-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      count: ${{ steps.scope.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - id: scope
        run: node ops/authoring/editor-review-scope.mjs
  review:
    needs: scope
    if: needs.scope.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefer-offline --no-audit --no-fund
      - id: review
        name: Build selected public MDX with the real Astro components
        env:
          REVIEW_SOURCE: ${{ matrix.path }}
          REVIEW_COMMIT: ${{ matrix.commit }}
        run: npm run editor:review -- --source "$REVIEW_SOURCE" --commit "$REVIEW_COMMIT" --output .local/editor-review-output --github-output "$GITHUB_OUTPUT"
      - name: Upload public-text-only review package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.review.outputs.artifact-name }}
          path: .local/editor-review-output/review.json
          retention-days: 1
          if-no-files-found: error
# No R2 bindings, API credentials, deployment, approval, or private media bytes.
# Images are resolved by the authenticated editor, not by this public CI job.
