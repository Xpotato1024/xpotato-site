name: Temporary Phase 4 content materialization

on:
  push:
    branches:
      - codex/site-vnext-content-migration-phase4

permissions:
  contents: write

concurrency:
  group: phase4-materialize-temporary
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-content-migration-phase4
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Materialize Phase 4 content
        run: node scripts/phase4_materialize_content_temp.mjs
      - name: Remove one-time helpers
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/phase4-materialize-temporary.yml \
            .github/workflows/phase4-allocation-temporary.yml \
            scripts/phase4_materialize_content_temp.mjs \
            scripts/phase4_allocator_fix_temp.py
      - name: Validate generated content
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm run migration:content:check
          npm run ci
          git diff --check
      - name: Commit materialized content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes."
            exit 0
          fi
          git commit -m "feat: Phase 4 content candidatesをmaterialize"
          git push origin HEAD:codex/site-vnext-content-migration-phase4
