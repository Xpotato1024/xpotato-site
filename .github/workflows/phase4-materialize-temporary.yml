name: Temporary Phase 4 content materialization

on:
  push:
    branches:
      - codex/site-vnext-content-migration-phase4

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-content-migration-phase4
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Apply reviewed Phase 4 materialization fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path("packages/site-validators/src/phase4-content-migration-cli.ts")
          text = migration.read_text(encoding="utf-8")
          obsolete = '''const existingSameEntityTargetPaths = new Map<string, string>([
            ["apps/site/src/content/pages/about.mdx", "pages:about"],
            ["apps/site/src/content/tools/prime-factorizer.mdx", "tools:prime-factorizer"],
          ]);
          '''
          text = text.replace(obsolete, "")
          old = '''    if (currentAtTarget) {
                const expectedLegacyId = existingSameEntityTargetPaths.get(entry.targetPath);
                if (expectedLegacyId !== entry.legacyContentId || expectedSameEntity !== currentAtTarget) {
                  errors.push(`target path already contains a different vNext entity: ${entry.targetPath}`);
                }
                if (entry.vNextContentId !== currentAtTarget) {
                  errors.push(`same-entity migration must reuse current ContentId at ${entry.targetPath}`);
                }
              } else if (expectedSameEntity) {
                errors.push(`expected existing same-entity binding disappeared for ${entry.legacyContentId}`);
              }
          '''
          new = '''    if (currentAtTarget && currentAtTarget !== entry.vNextContentId) {
                errors.push(`target path already contains a different vNext entity: ${entry.targetPath}`);
              }
              if (!currentAtTarget && expectedSameEntity) {
                errors.push(`expected existing same-entity binding disappeared for ${entry.legacyContentId}`);
              }
          '''
          if old not in text:
              raise SystemExit("Phase 4 current-target validation block not found exactly")
          migration.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          materializer = Path("packages/site-validators/src/phase4-content-materialization.ts")
          text = materializer.read_text(encoding="utf-8")
          old = 'const collapseInlineWhitespace = (value: string): string => value.replace(/\\s+/gu, " ");\n'
          new = '''const escapeMdxText = (value: string): string => value.replace(/[{}]/gu, (character) => `\\\\${character}`);
          const collapseInlineWhitespace = (value: string): string => escapeMdxText(value.replace(/\\s+/gu, " "));
          '''
          if old not in text:
              raise SystemExit("LegacyHtml whitespace helper not found exactly")
          materializer.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Generate schemas
        run: npm run schema:generate
      - name: Materialize exact frozen legacy content
        run: npm run migration:content:materialize
      - name: Verify generated materialization
        run: |
          npm run migration:content:materialization:check
          npm run migration:content:check
          npm run test
          npm run typecheck
      - name: Commit machine materialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/site-validators/src/phase4-content-migration-cli.ts \
            packages/site-validators/src/phase4-content-materialization.ts \
            schemas/generated/phase4-content-materialization-manifest.schema.json \
            docs/migration/content-materialization-v1.json \
            apps/site/src/content
          if git diff --cached --quiet; then
            echo "No Phase 4 materialization changes to commit."
            exit 0
          fi
          git commit -m "feat: frozen legacy content 53件をvNextへmaterialize"
          git push origin HEAD:codex/site-vnext-content-migration-phase4
