name: Temporary Phase 4 content allocation

on:
  push:
    branches:
      - codex/site-vnext-content-migration-phase4

permissions:
  contents: write

jobs:
  allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-content-migration-phase4
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Patch Phase 4 allocator implementation
        run: python scripts/phase4_allocator_fix_temp.py
      - name: Install dependencies
        run: npm ci
      - name: Generate schemas
        run: npm run schema:generate
      - name: Allocate stable ContentIds exactly once
        run: npm run migration:content:allocate
      - name: Generate Phase 4 candidate baseline
        run: npm run migration:content:candidates
      - name: Check Phase 4 candidate baseline
        run: npm run migration:content:check
      - name: Commit machine artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/site-validators/src/phase4-content-migration-cli.ts \
            schemas/generated/phase4-content-identity-map.schema.json \
            schemas/generated/phase4-content-candidate-manifest.schema.json \
            docs/migration/content-id-map-v1.json \
            docs/migration/content-candidate-baseline-v1.json
          git commit -m "feat: Phase 4 ContentId allocationとcandidate baselineを確定"
          git push origin HEAD:codex/site-vnext-content-migration-phase4
