name: Phase 6 media readiness

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - ".node-version"
      - "scripts/conditional-scope.mjs"
      - "docs/migration/media-raw-inventory-v1.json"
      - "docs/migration/media-review-proposal-v1.json"
      - "docs/migration/media-repository-candidate-v1.json"
      - "docs/migration/media-local-processing-v1.json"
      - "docs/migration/phase6-media-review-acceptance-2026-09-04.md"
      - "docs/migration/phase6-media-profile-correction-proposal-2026-09-04.md"
      - "docs/migration/phase6-r2-source-recovery-evidence-2026-09-04.md"
      - "docs/migration/phase6-r2-hero-semantic-correction-proposal-2026-09-04.md"
      - "packages/content-contracts/src/phase6-media*.ts"
      - "packages/content-contracts/src/schema-registry.ts"
      - "packages/media-ingest/**"
      - "packages/site-validators/src/phase6-media-*.ts"
      - "packages/site-validators/package.json"
      - "schemas/generated/phase6-media-*.schema.json"
      - "package-lock.json"
      - ".github/workflows/phase6-media-readiness.yml"
  pull_request:
    paths:
      - "package.json"
      - ".node-version"
      - "scripts/conditional-scope.mjs"
      - "docs/migration/media-raw-inventory-v1.json"
      - "docs/migration/media-review-proposal-v1.json"
      - "docs/migration/media-repository-candidate-v1.json"
      - "docs/migration/media-local-processing-v1.json"
      - "docs/migration/phase6-media-review-acceptance-2026-09-04.md"
      - "docs/migration/phase6-media-profile-correction-proposal-2026-09-04.md"
      - "docs/migration/phase6-r2-source-recovery-evidence-2026-09-04.md"
      - "docs/migration/phase6-r2-hero-semantic-correction-proposal-2026-09-04.md"
      - "packages/content-contracts/src/phase6-media*.ts"
      - "packages/content-contracts/src/schema-registry.ts"
      - "packages/media-ingest/**"
      - "packages/site-validators/src/phase6-media-*.ts"
      - "packages/site-validators/package.json"
      - "schemas/generated/phase6-media-*.schema.json"
      - "package-lock.json"
      - ".github/workflows/phase6-media-readiness.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select affected conditional validation
        id: scope
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/conditional-scope.mjs .github/workflows/phase6-media-readiness.yml migration:media:processing:check
      - name: Pin npm toolchain
        if: steps.scope.outputs.required == 'true'
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        if: steps.scope.outputs.required == 'true'
        run: npm ci
      - name: Validate Phase 6 accepted and locally processed media evidence
        if: steps.scope.outputs.required == 'true'
        run: |
          npm run migration:media:processing:check
          git diff --check
