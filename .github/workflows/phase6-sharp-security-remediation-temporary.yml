name: Temporary Phase 6 Sharp security remediation

on:
  push:
    branches:
      - codex/site-vnext-media-phase6

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-media-phase6
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci

      - name: Upgrade Phase 6 Sharp runtime to patched release
        run: |
          npm install sharp@0.35.4 --workspace @xpotato/media-ingest --save-exact
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/media-ingest/src/sharp-runtime.ts")
          text = path.read_text(encoding="utf-8")
          old = 'sharpPackageVersion: "0.34.5",'
          new = 'sharpPackageVersion: "0.35.4",'
          if text.count(old) != 1:
              raise SystemExit(f"expected one Sharp version binding, got {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          npm ls sharp

      - name: Assert Sharp security finding is removed
        run: |
          npm audit --json > .local-npm-audit.json || true
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const audit = JSON.parse(await readFile('.local-npm-audit.json', 'utf8'));
          if (audit.vulnerabilities?.sharp) {
            throw new Error(`sharp remains in npm audit: ${JSON.stringify(audit.vulnerabilities.sharp)}`);
          }
          console.log(`npm audit remaining baseline findings=${JSON.stringify(audit.metadata?.vulnerabilities ?? {})}; sharp=clean`);
          NODE
          rm .local-npm-audit.json

      - name: Regenerate exact Phase 6 processing evidence
        run: |
          npm run schema:check
          npm run migration:media:review:proposal:check
          npm run migration:media:candidate:check
          npm run migration:media:processing
          npm run migration:media:processing:check
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const processing = JSON.parse(await readFile('docs/migration/media-local-processing-v1.json', 'utf8'));
          if (processing.semanticAssetCount !== 101 || processing.processedAssetCount !== 101 || processing.deferredAssetCount !== 0) {
            throw new Error(`processing coverage ${processing.processedAssetCount}/${processing.semanticAssetCount}; deferred=${processing.deferredAssetCount}`);
          }
          if (processing.records.some((item) => item.status !== 'processed' || item.blockers.length !== 0)) {
            throw new Error('processing manifest contains a non-processed or blocked record');
          }
          console.log(`PROCESSING_SHA=${processing.manifestPayloadSha256}`);
          console.log(`TOOLCHAIN_SHA=${processing.toolchainSha256}`);
          NODE

      - name: Validate full repository after security remediation
        run: |
          npm run test
          npm run typecheck
          npm run ci
          git diff --check

      - name: Upload patched processing bytes
        uses: actions/upload-artifact@v4
        with:
          name: phase6-local-media-processing-sharp-0.35.4
          path: .local/migration/phase6/processing-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Commit patched runtime and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6-sharp-security-remediation-temporary.yml
          git add \
            packages/media-ingest/package.json \
            package-lock.json \
            packages/media-ingest/src/sharp-runtime.ts \
            docs/migration/media-local-processing-v1.json
          git commit -m "fix: Phase 6 Sharp runtimeを0.35.4へ更新"
          git push origin HEAD:codex/site-vnext-media-phase6
