name: Temporary Phase 5 taxonomy raw inventory

on:
  push:
    branches:
      - codex/site-vnext-taxonomy-phase5

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-taxonomy-phase5
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Generate exact raw taxonomy inventory
        run: |
          npm run migration:taxonomy:inventory
          npm run test -- --run packages/site-validators/src/phase5-taxonomy-inventory.test.ts
          npm run typecheck
      - name: Commit inventory and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase5-taxonomy-inventory-temporary.yml
          git add docs/migration/taxonomy-raw-inventory-v1.json
          git commit -m "feat: frozen taxonomy raw inventoryを固定"
          git push origin HEAD:codex/site-vnext-taxonomy-phase5
