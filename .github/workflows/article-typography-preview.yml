name: Article typography preview (temporary, no deploy)

on:
  pull_request:

permissions:
  contents: read

jobs:
  accurate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Create temporary font-aware article fixture (not committed or published)
        shell: bash
        run: |
          mkdir -p apps/site/src/pages/article-preview-fixture
          cat > apps/site/src/pages/article-preview-fixture/infill.astro <<'ARTICLE'
          ---
          import BaseLayout from "../../layouts/BaseLayout.astro";
          import ArticleIcon from "../../components/content/ArticleIcon.astro";
          import Callout from "../../components/content/Callout.astro";
          import DiagnosticList from "../../components/content/DiagnosticList.astro";
          import DiagnosticItem from "../../components/content/DiagnosticItem.astro";
          import Steps from "../../components/content/Steps.astro";
          import Step from "../../components/content/Step.astro";
          import articleCssHref from "../../styles/article-structure.css?url";
          const title = "3Dプリンタの充填率は100%にすれば丈夫になる？";
          const summary = "外周・インフィル・造形方向の違いを図と症状別の確認ポイントで整理します。";
          ---
          <BaseLayout title={title} description={summary} noindex={true} articleCssHref={articleCssHref}>
            <main id="main-content" class="content-page" data-search-collection="notes">
              <article>
                <header class="content-heading">
                  <p class="eyebrow">ARTICLES / DESIGN PREVIEW — 非公開</p>
                  <h1>{title}</h1>
                  <p class="content-description">{summary}</p>
                  <div class="article-meta"><span>フォント・見出し・本文の実描画確認</span></div>
                </header>
                <nav class="table-of-contents" aria-label="この記事の目次">
                  <p><ArticleIcon name="contents" />目次</p>
                  <ol>
                    <li><a href="#what">外周とインフィルの役割</a></li>
                    <li><a href="#direction">積み重ねる方向も重要</a></li>
                    <li><a href="#diagnostics">壊れ方から設定を見直す</a></li>
                    <li><a href="#steps">印刷前の確認手順</a></li>
                  </ol>
                </nav>
                <div class="prose">
                  <p>3Dプリンタで部品を作るとき、充填率を100%にすれば丈夫になると思っていませんか？ 実は、内部を隙間なく埋めるより、外周の厚さや印刷する向きを見直した方が効果的な場合があります。</p>
                  <Callout kind="important" title="先に結論">
                    <p>部品の強さは充填率だけでは決まりません。<strong>どこに、どんな力がかかるか</strong>を考えることが出発点です。</p>
                  </Callout>
                  <h2 id="what">外周とインフィルの役割</h2>
                  <p>外周は部品の輪郭を作る壁、インフィルは内部の支えです。次の模式図では、外側の太線が外周、内側の交差線がインフィルを表します。</p>
                  <figure>
                    <svg viewBox="0 0 680 200" role="img" aria-label="長方形の断面。外側に太い外周の壁、内側に斜めの格子状の充填構造が配置されている。">
                      <defs><pattern id="cross" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0 24 24 M24 0 0 24" fill="none" stroke="#b7a8c8" stroke-width="1.5"/></pattern></defs>
                      <rect x="50" y="22" width="390" height="145" rx="3" fill="#f3eff8" stroke="#745399" stroke-width="11"/>
                      <rect x="58" y="30" width="374" height="129" fill="url(#cross)"/>
                      <path d="M446 46 L522 45" stroke="#745399" stroke-width="2"/>
                      <text x="529" y="49" font-size="18" fill="#15141d">外周（壁）</text>
                      <path d="M328 115 L522 116" stroke="#8f75ab" stroke-width="2"/>
                      <text x="529" y="120" font-size="18" fill="#15141d">内部の支え</text>
                    </svg>
                    <figcaption>模式図：外側の壁と内部の支えは、それぞれ違う役割を持ちます。実際の形状や強度比を表すものではありません。</figcaption>
                  </figure>
                  <h3 id="roles">強度を上げたいときの見方</h3>
                  <p>曲げる力に対しては外側の壁が重要になる場合があり、上から押す力に対しては内部の支えも影響します。</p>
                  <h2 id="direction">積み重ねる方向も重要</h2>
                  <p>FDM方式では樹脂を層状に積み重ねます。層と層を引き離す向きに力がかかると、充填率だけでは改善しにくいことがあります。</p>
                  <h2 id="diagnostics">壊れ方から設定を見直す</h2>
                  <p>印刷した部品が壊れたら、まず「どこが、どう壊れたか」を見てみましょう。</p>
                  <DiagnosticList>
                    <DiagnosticItem symptom="曲げると折れる" check="外周・根元の形状・造形方向">
                      <p>根元に曲げる力が集中していないか、最初に見てみましょう。</p>
                    </DiagnosticItem>
                    <DiagnosticItem symptom="上から押すとへこむ" check="インフィル・上面の厚さ">
                      <p>押された面が、内側から十分に支えられているか確かめます。</p>
                    </DiagnosticItem>
                    <DiagnosticItem symptom="層の境目で割れる" check="造形方向・温度・冷却条件">
                      <p>層同士を引き離す力がかかる配置になっていないかを確認します。</p>
                    </DiagnosticItem>
                  </DiagnosticList>
                  <h2 id="steps">印刷前の確認手順</h2>
                  <Steps>
                    <Step title="部品にかかる力を考える">曲げる、押す、引っ張るなど、実際の使い方を整理します。</Step>
                    <Step title="外周と造形方向を見直す">負荷のかかる場所や層の向きを確認します。</Step>
                    <Step title="必要に応じてインフィルを調整する" result="強度が重要な部品は実荷重で検証します。">内部の支えが不足している場合に変更します。</Step>
                  </Steps>
                  <p>闇雲に設定を増やすより、まず部品の壊れ方から考える方が、無駄な材料や印刷時間を減らす判断につながります。</p>
                </div>
              </article>
            </main>
          </BaseLayout>
          ARTICLE
      - name: Actual Astro build with checked-in webfonts
        run: npm run build:site
      - name: Capture via Chrome DevTools Protocol and verify loaded font faces
        shell: bash
        run: |
          mkdir -p article-preview
          python3 -m http.server 4177 --directory apps/site/dist >/tmp/article-preview-http.log 2>&1 &
          for i in {1..40}; do if curl -fsS http://127.0.0.1:4177/article-preview-fixture/infill/ >/dev/null; then break; fi; sleep 0.25; done
          curl -fsS http://127.0.0.1:4177/article-preview-fixture/infill/ | grep -q 'class="prose"'
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-proxy-server --remote-debugging-port=9222 --user-data-dir=/tmp/article-preview-chrome about:blank >/tmp/article-preview-chrome.log 2>&1 &
          cat > /tmp/capture-article-preview.mjs <<'NODE'
          import { writeFileSync } from 'node:fs';
          const delay = ms => new Promise(r=>setTimeout(r,ms));
          let pages=[];
          for(let i=0;i<100;i++){
            try{pages=await(await fetch('http://127.0.0.1:9222/json')).json();if(pages[0]?.webSocketDebuggerUrl)break;}catch{}
            await delay(250);
          }
          if(!pages[0]?.webSocketDebuggerUrl)throw Error('Chrome CDP not available');
          const ws = new WebSocket(pages[0].webSocketDebuggerUrl);
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject;});
          let id=0;const pending=new Map();
          ws.onmessage=e=>{
            const msg=JSON.parse(e.data);
            if(!msg.id)return;
            const p=pending.get(msg.id);if(!p)return;
            pending.delete(msg.id);
            if(msg.error)p.reject(Error(JSON.stringify(msg.error)));else p.resolve(msg.result);
          };
          const send=(method,params={})=>new Promise((resolve,reject)=>{
            const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}));
          });
          await send('Page.enable');await send('Runtime.enable');
          const evalJS=async expression=>{
            const r=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});
            if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));
            return r.result?.value;
          };
          const results=[];
          for(const item of [{key:'desktop',width:1440,height:1120},{key:'mobile',width:390,height:900},{key:'narrow',width:320,height:900}]){
            await send('Emulation.setDeviceMetricsOverride',{width:item.width,height:item.height,deviceScaleFactor:1,mobile:item.width<600});
            const nav=await send('Page.navigate',{url:'http://127.0.0.1:4177/article-preview-fixture/infill/'}); if(nav.errorText)throw Error('CDP navigation: '+JSON.stringify(nav));
            let ready=false,lastState=null;
            for(let i=0;i<120;i++){
              lastState=await evalJS('({href:location.href,ready:document.readyState,hasProse:!!document.querySelector(".prose"),text:document.body?.innerText?.slice(0,120)})');
              if(lastState.ready==='complete' && lastState.hasProse && lastState.href.includes('/article-preview-fixture/infill/')){ready=true;break;} await delay(150);
            }
            if(!ready)throw Error('Page failed to load: '+JSON.stringify(lastState));
            const result=await evalJS('(async()=>{await document.fonts.ready;await Promise.all([...document.images].map(x=>x.decode().catch(()=>{})));return {title:document.title,fonts:[...document.fonts].filter(f=>f.status==="loaded").map(f=>({family:f.family,weight:f.weight})),body:getComputedStyle(document.querySelector(".prose")).fontFamily,h2:getComputedStyle(document.querySelector(".prose h2")).fontFamily,scrollWidth:document.documentElement.scrollWidth,viewport:document.documentElement.clientWidth,fontResources:performance.getEntriesByType("resource").filter(x=>x.name.includes(".woff2")).length};})()');
            if(result.scrollWidth>result.viewport)throw Error('Horizontal overflow '+JSON.stringify(result));
            if(!result.fonts.some(f=>f.family.includes('Zen Kaku Gothic New'))||!result.fonts.some(f=>f.family.includes('Noto Serif JP')))throw Error('Web font not actually loaded: '+JSON.stringify(result));
            const metrics=await send('Page.getLayoutMetrics');
            const clip={x:0,y:0,width:item.width,height:Math.ceil(metrics.cssContentSize.height),scale:1};
            const full=await send('Page.captureScreenshot',{format:'png',clip,captureBeyondViewport:true});
            writeFileSync('article-preview/'+item.key+'-full.png',Buffer.from(full.data,'base64'));
            await evalJS('document.getElementById("diagnostics").scrollIntoView({block:"start"})');
            await delay(350);
            const diag=await send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});
            writeFileSync('article-preview/'+item.key+'-diagnostics.png',Buffer.from(diag.data,'base64'));
            results.push({viewport:item.width+'x'+item.height,...result});
          }
          writeFileSync('article-preview/verification.json',JSON.stringify({source:process.env.GITHUB_SHA,results},null,2));
          ws.close();
          console.log(JSON.stringify(results,null,2));
          NODE
          node /tmp/capture-article-preview.mjs
          node -e "const fs=require('fs');for(const n of ['desktop','mobile'])console.log('ARTICLE_PREVIEW_'+n.toUpperCase()+'='+fs.readFileSync('article-preview/'+n+'-diagnostics.png').toString('base64'));"
      - name: Publish screenshot-only artifact (no fonts or site files)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: article-typography-accurate-preview
          path: article-preview/
          if-no-files-found: error
          retention-days: 14
