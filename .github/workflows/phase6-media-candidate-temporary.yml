name: Temporary Phase 6 repository media candidate

on:
  push:
    branches:
      - codex/site-vnext-media-phase6

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-media-phase6
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci
      - name: Generate accepted Phase 6 repository candidate
        run: |
          npm run schema:generate
          npm run migration:media:inventory:check
          npm run migration:media:review:proposal:check
          npm run migration:media:candidate:emit
          npm run migration:media:candidate:check
          npm run test
          npm run typecheck
      - name: Upload deterministic SVG source evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase6-deterministic-media-sources
          path: .local/migration/phase6/deterministic-sources
          if-no-files-found: error
          retention-days: 30
      - name: Commit machine candidate and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6-media-candidate-temporary.yml
          git add docs/migration/media-repository-candidate-v1.json schemas/generated/phase6-media-repository-candidate-manifest.schema.json
          git commit -m "feat: Phase 6 repository media candidateを固定"
          git push origin HEAD:codex/site-vnext-media-phase6
