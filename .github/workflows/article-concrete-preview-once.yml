name: Concrete article preview (temporary, no deploy)
on:
  pull_request:
permissions:
  contents: read
jobs:
  article-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      ARTICLE_PREVIEW_BROWSER: google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 && npm ci
      - name: Render labelled diagrams and exact article layout
        run: npx tsx scripts/article-concrete-preview.ts
      - name: Capture actual fonts, viewports and print layout
        run: node scripts/article-concrete-export.mjs
      - name: Export review composition only (no fonts or website tree)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: article-concrete-review-composition
          path: .local/article-concrete/export/
          if-no-files-found: error
          retention-days: 7
