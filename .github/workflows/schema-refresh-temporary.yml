name: Temporary schema refresh

on:
  push:
    branches:
      - codex/site-vnext-legacy-reproduction-contract

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Generate schemas
        run: npm run schema:generate
      - uses: actions/upload-artifact@v4
        with:
          name: generated-legacy-baseline-schema
          path: schemas/generated/legacy-freeze-baseline.schema.json
          if-no-files-found: error
