name: Temporary Phase 4 staging and formatting

on:
  push:
    branches:
      - codex/site-vnext-content-migration-phase4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-content-migration-phase4
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Apply reviewed Phase 4 staging and formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          materializer = Path("packages/site-validators/src/phase4-content-materialization.ts")
          text = materializer.read_text(encoding="utf-8")

          anchor = '''const indentContinuation = (source: string, width: number): string => {
            const lines = source.trim().split("\\n");
            const padding = " ".repeat(width);
            return lines.map((line, index) => index === 0 ? line : line.length === 0 ? "" : `${padding}${line}`).join("\\n");
          };

          '''
          replacement = anchor + '''const inlineListItemTags = new Set(["strong", "b", "em", "i", "code", "a", "span", "small", "mark", "sup", "sub", "br", "img"]);
          const isInlineListItemChild = (node: HtmlNodeLike): boolean =>
            node.nodeName === "#text" || inlineListItemTags.has(tagName(node));

          '''
          if anchor not in text:
              raise SystemExit("indentContinuation anchor not found")
          text = text.replace(anchor, replacement)
          old = '''    const content = renderBlockChildren(item).trim();
          '''
          new = '''    const content = childNodes(item).every(isInlineListItemChild)
                ? childNodes(item).map(renderInline).join("").trim()
                : renderBlockChildren(item).trim();
          '''
          if old not in text:
              raise SystemExit("renderList content line not found")
          text = text.replace(old, new)

          old = '''const publicationFields = (data: Readonly<Record<string, unknown>>): Record<string, unknown> => {
            const legacyPath = optionalString(data.legacyPath);
            const canonical = optionalString(data.canonical);
            const seo = canonical?.startsWith("https://") ? { canonicalOverride: canonical } : undefined;
            return {
              draft: data.draft === true,
              ...(legacyPath ? { legacyUrls: [legacyPath] } : {}),
              ...(seo ? { seo } : {}),
            };
          };
          '''
          new = '''const publicationFields = (data: Readonly<Record<string, unknown>>, targetDraft: boolean): Record<string, unknown> => {
            const legacyPath = optionalString(data.legacyPath);
            const canonical = optionalString(data.canonical);
            const seo = canonical?.startsWith("https://") ? { canonicalOverride: canonical } : undefined;
            return {
              draft: targetDraft,
              ...(legacyPath ? { legacyUrls: [legacyPath] } : {}),
              ...(seo ? { seo } : {}),
            };
          };
          '''
          if old not in text:
              raise SystemExit("publicationFields block not found")
          text = text.replace(old, new)

          old = '''const buildFrontmatter = (
            entry: Phase4ContentIdentityEntry,
            candidate: Phase4ContentCandidate,
            data: Readonly<Record<string, unknown>>,
          ): Readonly<Record<string, unknown>> => {
            const updatedDate = optionalIsoDate(data.updatedDate, "updatedDate", entry.legacyPath);
            const publication = publicationFields(data);
          '''
          new = '''const buildFrontmatter = (
            entry: Phase4ContentIdentityEntry,
            candidate: Phase4ContentCandidate,
            data: Readonly<Record<string, unknown>>,
            targetDraft: boolean,
          ): Readonly<Record<string, unknown>> => {
            const updatedDate = optionalIsoDate(data.updatedDate, "updatedDate", entry.legacyPath);
            const publication = publicationFields(data, targetDraft);
          '''
          if old not in text:
              raise SystemExit("buildFrontmatter signature not found")
          text = text.replace(old, new)

          old = '''    const frontmatter = buildFrontmatter(entry, candidate, data);
            const convertedBody = convertBody(candidate, bodySource, candidate.title, legacyHtmlRawSha256);
          '''
          new = '''    const targetDraft = entry.collection === "blog" ? true : candidate.draft;
            const frontmatter = buildFrontmatter(entry, candidate, data, targetDraft);
            const convertedBody = convertBody(candidate, bodySource, candidate.title, legacyHtmlRawSha256);
          '''
          if old not in text:
              raise SystemExit("frontmatter construction call not found")
          text = text.replace(old, new)

          old = '''      targetFrontmatterSha256: fingerprint(frontmatter),
                bodyConversion: convertedBody.conversion,
          '''
          new = '''      targetFrontmatterSha256: fingerprint(frontmatter),
                sourceDraft: candidate.draft,
                targetDraft,
                publicationHoldReasons: entry.collection === "blog" && !candidate.draft ? ["blog_media_registry"] : [],
                bodyConversion: convertedBody.conversion,
          '''
          if old not in text:
              raise SystemExit("materialization record target hash block not found")
          materializer.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          test_path = Path("packages/site-validators/src/phase4-content-materialization.test.ts")
          test = test_path.read_text(encoding="utf-8")
          test = test.replace('"<ul><li>項目A</li><li>項目B</li></ul>",', '"<ul><li><strong>項目A</strong>：説明</li><li>項目B</li></ul>",')
          test = test.replace('expect(markdown).toContain("- 項目A");', 'expect(markdown).toContain("- **項目A**：説明");')
          test_path.write_text(test, encoding="utf-8", newline="\n")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Regenerate schemas and staged materialization
        run: |
          npm run schema:generate
          npm run migration:content:materialize
          npm run ci
      - name: Commit staging refinement and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase4-format-temporary.yml
          git add \
            packages/site-validators/src/phase4-content-materialization.ts \
            packages/site-validators/src/phase4-content-materialization.test.ts \
            schemas/generated/phase4-content-materialization-manifest.schema.json \
            docs/migration/content-materialization-v1.json \
            apps/site/src/content
          git commit -m "fix: Phase 4 BlogをMedia Registry完了までstaging"
          git push origin HEAD:codex/site-vnext-content-migration-phase4
