name: Temporary Phase 4 finalizer

on:
  push:
    branches:
      - codex/site-vnext-content-migration-phase4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-content-migration-phase4
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Apply reviewed finalizer
        run: python scripts/phase4_finalize_temp.py
      - name: Install dependencies
        run: npm ci
      - name: Regenerate and validate staged materialization
        run: |
          npm run schema:generate
          npm run migration:content:materialize
          npm run ci
          git diff --check
      - name: Commit finalization and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/phase4-format-temporary.yml \
            scripts/phase4_finalize_temp.py
          git add \
            packages/site-validators/src/phase4-content-materialization.ts \
            packages/site-validators/src/phase4-content-materialization.test.ts \
            schemas/generated/phase4-content-materialization-manifest.schema.json \
            docs/migration/content-materialization-v1.json \
            apps/site/src/content
          git commit -m "fix: Phase 4 BlogをMedia Registry完了までstaging"
          git push origin HEAD:codex/site-vnext-content-migration-phase4
