name: Temporary Phase 4 editorial review finalizer

on:
  push:
    branches:
      - codex/site-vnext-content-migration-phase4

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-content-migration-phase4
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Apply reviewed editorial materialization
        run: python scripts/phase4_editorial_review_temp.py
      - name: Install dependencies
        run: npm ci
      - name: Regenerate reviewed materialization
        run: |
          npm run schema:generate
          npm run migration:content:materialize
          python scripts/phase4_editorial_review_temp.py --sync-doc
      - name: Validate complete Phase 4 state
        run: |
          npm run ci
          git diff --check
      - name: Commit reviewed state and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/phase4-editorial-review-temporary.yml \
            scripts/phase4_editorial_review_temp.py
          git add \
            packages/content-contracts/src/phase4-migration.ts \
            packages/site-validators/src/phase4-content-materialization.ts \
            packages/site-validators/src/phase4-content-materialization.test.ts \
            schemas/generated/phase4-content-materialization-manifest.schema.json \
            docs/migration/content-materialization-v1.json \
            docs/migration/content-materialization-2026-08-29.md \
            apps/site/src/content/pages/about.mdx \
            apps/site/src/content/projects/xpotato-site.mdx
          git commit -m "fix: Phase 4 current-state editorial reviewを記録"
          git push origin HEAD:codex/site-vnext-content-migration-phase4
