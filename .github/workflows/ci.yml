name: vNext CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# Only obsolete revisions of the same PR may be cancelled. Each main push
# retains its own run and immutable Production artifact provenance.
concurrency:
  group: vnext-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Verify approval boundary and synthetic safety failure paths (no credentials)
        run: node --test ops/deployment/environment-approval.test.mjs ops/deployment/deployment-policy.test.mjs ops/deployment/deployment-persistent-policy.test.mjs ops/deployment/deployment-adapters.test.mjs ops/deployment/monitoring/site-integrity-monitor.test.mjs ops/deployment/monitoring/site-monitor-bootstrap.test.mjs ops/deployment/monitoring/site-monitor-bootstrap-once.test.mjs ops/deployment/monitoring/site-monitor-runtime.test.mjs ops/deployment/monitoring/site-monitor-trial.test.mjs ops/deployment/monitoring/site-monitor-readiness.test.mjs ops/deployment/shared/site-domain-evidence.test.mjs ops/deployment/monitoring/site-monitor-conditions.test.mjs ops/deployment/monitoring/site-monitor-candidate.test.mjs ops/deployment/monitoring/site-monitor-version-structure.test.mjs ops/deployment/monitoring/site-monitor-version-structure-cli.test.mjs ops/deployment/monitoring/site-monitor-finite.test.mjs ops/deployment/monitoring/site-monitor-finite-cli.test.mjs ops/deployment/monitoring/site-monitor-evidence-cli.test.mjs ops/deployment/monitoring/site-monitor-armed.test.mjs ops/deployment/monitoring/site-monitor-armed-cli.test.mjs ops/deployment/monitoring/site-monitor-evidence-ready.test.mjs ops/deployment/manual-deployment-readiness.test.mjs ops/deployment/manual-deployment.test.mjs

  scope:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.scope.outputs.core }}
      reason: ${{ steps.scope.outputs.reason }}
      article: ${{ steps.article-policy.outputs.article }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - id: scope
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: node ops/ci/ci-scope.mjs
      - name: Observe change impact without skipping checks
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_IMPACT_REPORT: ${{ runner.temp }}/ci-impact.json
        run: node ops/ci/ci-impact.mjs
      - id: article-policy
        name: Select draft candidates from exact Git revisions
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: node ops/ci/article-pr-policy.mjs
      - name: Preserve shadow impact report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-ci-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-impact.json
          if-no-files-found: error
          retention-days: 30
      - name: Classifier and execution graph regression
        run: node --test ops/ci/article-pr-policy.test.mjs ops/ci/ci-result.test.mjs ops/ci/ci-hosted-gate.test.mjs ops/ci/ci-fixtures.test.mjs ops/ci/ci-scope.test.mjs ops/ci/ci-impact.test.mjs ops/ci/ci-source.test.mjs ops/ci/producer-parallel.test.mjs ops/ci/release-graph.test.mjs ops/qa/lighthouse-collect.test.mjs
  article-fast:
    needs: scope
    if: needs.scope.outputs.core == 'true' && needs.scope.outputs.article == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      eligible: ${{ steps.admission.outputs.eligible }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefer-offline
      - id: admission
        name: Verify old and new drafts and their derived CMS index
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: node --import tsx ops/ci/article-pr-admission.ts
      - name: Validate complete draft source and public output
        if: steps.admission.outputs.eligible == 'true'
        env:
          XPOTATO_SITE_TEMP_ROOT: ${{ runner.temp }}/article-validation
        run: npm run ci:article:fast

  article-regression:
    needs: [scope, article-fast]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.core == 'true' &&
          (needs.scope.outputs.article == 'false' ||
           (needs.article-fast.result == 'success' && needs.article-fast.outputs.eligible == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefer-offline
      - name: Exercise the real draft pipeline with isolated CMS edits
        env:
          XPOTATO_SITE_TEMP_ROOT: ${{ runner.temp }}/article-regression
          XPOTATO_ARTICLE_FIXTURE_REPORT: ${{ runner.temp }}/article-regression.json
        run: npm run ci:article:fixture
      - name: Preserve synthetic draft validation and timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-article-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/article-regression.json
          if-no-files-found: warn
          retention-days: 30

  source-validation:
    needs: [scope, article-fast]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.core == 'true' &&
          (needs.scope.outputs.article == 'false' ||
           (needs.article-fast.result == 'success' && needs.article-fast.outputs.eligible == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefer-offline
      - name: Prepare Chrome font cache for isolated profiles
        run: node ops/ci/prepare-chrome-font-cache.mjs
      - env:
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
        run: npm run ci:source:validate

  publication-fixtures:
    needs: [scope, article-fast]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.core == 'true' &&
          (needs.scope.outputs.article == 'false' ||
           (needs.article-fast.result == 'success' && needs.article-fast.outputs.eligible == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefer-offline
      - env:
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
        run: npm run ci:fixtures:lifecycle

  common-tool:
    needs: [scope, article-fast]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.core == 'true' &&
          (needs.scope.outputs.article == 'false' ||
           (needs.article-fast.result == 'success' && needs.article-fast.outputs.eligible == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      XPOTATO_RELEASE_BROWSER_RUN: common-tool-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefer-offline
      - name: Prepare Chrome font cache for isolated profiles
        run: node ops/ci/prepare-chrome-font-cache.mjs
      - env:
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
        run: npm run release:interaction -- common-tool
      - name: Preserve independent Common Tool quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-common-tool-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-validation/axe-common-tool-final-dist.json
            ${{ runner.temp }}/release-validation/release-common-tool-result.json
            ${{ runner.temp }}/release-validation/common-tool-workflows-browser.json
            ${{ runner.temp }}/release-validation/common-tool-*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  producer:
    needs: [scope, article-fast]
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.core == 'true' &&
          (needs.scope.outputs.article == 'false' ||
           (needs.article-fast.result == 'success' && needs.article-fast.outputs.eligible == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      # Reuse setup-node's lock-keyed npm download cache; npm ci still verifies
      # package-lock integrity and builds a fresh node_modules tree.
      - run: npm ci --prefer-offline
      - id: media-cache-key
        name: Bind public image cache to source and toolchain
        run: npm run ci:media-cache:key
      - id: media-cache-restore
        name: Restore public derived images only
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.media-cache-key.outputs.key }}
          enableCrossOsArchive: false
          path: |
            .local/home-workshop-build/candidate.json
            .local/home-workshop-build/public-master
            .local/home-workshop-build/variants
            .local/home-workshop-build/mobile
            .local/home-workshop-build/social
      - name: Require exact restored cache identity
        env:
          EXPECTED_KEY: ${{ steps.media-cache-key.outputs.key }}
          MATCHED_KEY: ${{ steps.media-cache-restore.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" && "$MATCHED_KEY" != "$EXPECTED_KEY" ]]; then echo 'Unexpected image cache key'; exit 1; fi
          echo "Image cache: ${MATCHED_KEY:+exact hit}${MATCHED_KEY:-miss}; every object is validated by the normal build" >> "$GITHUB_STEP_SUMMARY"
      # Only the binaries are cached; OS dependencies are still checked on each
      # runner. Restore before starting either preparation lane.
      - name: Restore version-pinned WebKit browser binaries
        id: webkit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright
          key: site-webkit-v1-ubuntu-24.04-${{ runner.arch }}-playwright-1.65.0
      - name: Require exact restored WebKit cache identity
        env:
          EXPECTED_KEY: ${{ steps.webkit-cache.outputs.cache-primary-key }}
          MATCHED_KEY: ${{ steps.webkit-cache.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" && "$MATCHED_KEY" != "$EXPECTED_KEY" ]]; then echo 'Unexpected WebKit cache key'; exit 1; fi
          echo "WebKit cache: ${MATCHED_KEY:+exact hit}${MATCHED_KEY:-miss}; OS dependencies and real WebKit checks remain mandatory" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the one public build and browser engines concurrently
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
          XPOTATO_SITE_TEMP_ROOT: ${{ runner.temp }}/release-validation/phase8
        run: npm run ci:producer:prepare
      # Keep a step boundary: Chrome's prepared font cache is exported through
      # GITHUB_ENV only after both preparation lanes have completed successfully.
      - name: Validate the same build in WebKit and Chrome concurrently
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
          XPOTATO_SITE_TEMP_ROOT: ${{ runner.temp }}/release-validation/phase8
        run: npm run ci:producer:validate
      - name: Save WebKit browser cache after its real CSS smoke passes
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright
          key: site-webkit-v1-ubuntu-24.04-${{ runner.arch }}-playwright-1.65.0
      - name: Require this attempt's independent source and private validations
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ci:hosted:gate
      - name: Verify exact public cache files before saving
        run: npm run ci:media-cache:verify
      - name: Package the already validated build
        env:
          XPOTATO_RELEASE_PACKAGE: ${{ runner.temp }}/release-package
        run: npm run release:package
      - id: upload
        name: Preserve immutable release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Save verified public derived images only
        if: steps.media-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.media-cache-key.outputs.key }}
          enableCrossOsArchive: false
          path: |
            .local/home-workshop-build/candidate.json
            .local/home-workshop-build/public-master
            .local/home-workshop-build/variants
            .local/home-workshop-build/mobile
            .local/home-workshop-build/social
      - name: Record external identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Artifact ID: $ARTIFACT_ID; SHA-256: $ARTIFACT_DIGEST; build count: 1" >> "$GITHUB_STEP_SUMMARY"
      - name: Supplementary Lighthouse report (nonblocking, final dist only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          XPOTATO_LIGHTHOUSE_REPORT: ${{ runner.temp }}/lighthouse-report
        run: npm run quality:lighthouse
      - name: Preserve local quality reports (no public report service)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-validation/axe-*-final-dist.json
            ${{ runner.temp }}/release-validation/release-*-result.json
            ${{ runner.temp }}/release-validation/release-interaction-timing.json
            ${{ runner.temp }}/release-validation/design-roles-final-dist.json
            ${{ runner.temp }}/release-validation/article-metadata-browser.json
            ${{ runner.temp }}/release-validation/article-metadata-*.png
            ${{ runner.temp }}/release-validation/tool-style-api-browser.json
            ${{ runner.temp }}/release-validation/tool-style-api-*.png
            ${{ runner.temp }}/release-validation/project-carousel-browser.json
            ${{ runner.temp }}/release-validation/carousel-*.png
            ${{ runner.temp }}/release-validation/common-tool-workflows-browser.json
            ${{ runner.temp }}/release-validation/common-tool-*.png
            ${{ runner.temp }}/release-validation/prime-offline-*.png
            ${{ runner.temp }}/release-validation/prime-offline-final-dist.json
            ${{ runner.temp }}/release-validation/prime-tool-*.json
            ${{ runner.temp }}/release-validation/prime-site-*.json
            ${{ runner.temp }}/release-validation/prime-site-*.png
            ${{ runner.temp }}/release-validation/home-*.png
            ${{ runner.temp }}/release-validation/home-photo-final-dist.json
            ${{ runner.temp }}/release-validation/home-design-webkit.json
            ${{ runner.temp }}/lighthouse-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  windows-consumer:
    needs: producer
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Consumer fixture tests (Windows PowerShell 5.1, no npm install/build)
        shell: powershell
        run: ./ops/deployment/artifact/Test-ReleaseConsumer.ps1 -TempRoot "$env:RUNNER_TEMP/release-fixtures"
      - name: Linux archive to Windows staging (candidate verification only)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.producer.outputs.artifact-id }}
          RELEASE_DIGEST: ${{ needs.producer.outputs.artifact-digest }}
          RELEASE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./ops/deployment/artifact/Get-ReleaseArtifact.ps1 -ArtifactId $env:RELEASE_ARTIFACT_ID -ExpectedDigest "sha256:$env:RELEASE_DIGEST" -SourceSha $env:RELEASE_SOURCE -RunId $env:GITHUB_RUN_ID -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT) -OperationRoot "$env:RUNNER_TEMP/release-operation" -Mode Candidate

  result:
    if: always()
    needs:
      [
        scope,
        offline-policy,
        article-fast,
        article-regression,
        source-validation,
        publication-fixtures,
        common-tool,
        producer,
        windows-consumer,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Stable result
        env:
          POLICY_RESULT: ${{ needs.offline-policy.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          CORE: ${{ needs.scope.outputs.core }}
          REASON: ${{ needs.scope.outputs.reason }}
          ARTICLE: ${{ needs.scope.outputs.article }}
          ARTICLE_RESULT: ${{ needs.article-fast.result }}
          ARTICLE_ELIGIBLE: ${{ needs.article-fast.outputs.eligible }}
          ARTICLE_REGRESSION_RESULT: ${{ needs.article-regression.result }}
          SOURCE_RESULT: ${{ needs.source-validation.result }}
          FIXTURES_RESULT: ${{ needs.publication-fixtures.result }}
          COMMON_TOOL_RESULT: ${{ needs.common-tool.result }}
          PRODUCER_RESULT: ${{ needs.producer.result }}
          CONSUMER_RESULT: ${{ needs.windows-consumer.result }}
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then echo 'FAIL: classification/checks'; exit 1; fi
          if [[ "$POLICY_RESULT" != success ]]; then echo 'FAIL: deployment policy'; exit 1; fi
          if [[ "$CORE" == false ]]; then
            if [[ "$ARTICLE_RESULT" != skipped || "$ARTICLE_REGRESSION_RESULT" != skipped || "$SOURCE_RESULT" != skipped || "$FIXTURES_RESULT" != skipped || "$COMMON_TOOL_RESULT" != skipped || "$PRODUCER_RESULT" != skipped || "$CONSUMER_RESULT" != skipped ]]; then echo 'FAIL: prose-only gates overlapped'; exit 1; fi
            echo "$REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$CORE" != true ]]; then echo 'FAIL: missing core decision'; exit 1; fi
          if [[ "$ARTICLE" == true && "$ARTICLE_ELIGIBLE" == true ]]; then
            if [[ "$ARTICLE_RESULT" != success ]]; then echo 'FAIL: draft source/output validation'; exit 1; fi
