name: vNext CI

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic vNext and legacy migration gates
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run ci
      - name: Export deterministic vNext deploy manifest
        run: npm run artifact:manifest -- "$RUNNER_TEMP/vnext-deploy-manifest.json"
      - name: Preserve hosted Linux deploy manifest
        uses: actions/upload-artifact@v4
        with:
          name: vnext-deploy-manifest
          path: ${{ runner.temp }}/vnext-deploy-manifest.json
          if-no-files-found: error
