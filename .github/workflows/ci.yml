name: vNext CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# Only obsolete revisions of the same PR may be cancelled. Each main push
# retains its own run and immutable Production artifact provenance.
concurrency:
  group: vnext-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.scope.outputs.core }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - id: scope
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs
      - name: Observe change impact without skipping checks
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_IMPACT_REPORT: ${{ runner.temp }}/ci-impact.json
        run: node scripts/ci-impact.mjs
      - name: Preserve shadow impact report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-ci-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-impact.json
          if-no-files-found: error
          retention-days: 30
      - name: Classifier and execution graph regression
        run: node --test scripts/ci-hosted-gate.test.mjs scripts/ci-fixtures.test.mjs scripts/ci-scope.test.mjs scripts/ci-impact.test.mjs scripts/ci-source.test.mjs scripts/release-graph.test.mjs tools/qa/lighthouse-collect.test.mjs

  source-validation:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefer-offline
      - env:
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
        run: npm run ci:source:validate

  publication-fixtures:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefer-offline
      - env:
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
        run: npm run ci:fixtures:lifecycle

  common-tool:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      XPOTATO_RELEASE_BROWSER_RUN: common-tool-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefer-offline
      - env:
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
        run: npm run release:interaction -- common-tool
      - name: Preserve independent Common Tool quality report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-common-tool-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-validation/axe-common-tool-final-dist.json
            ${{ runner.temp }}/release-validation/release-common-tool-result.json
            ${{ runner.temp }}/release-validation/common-tool-workflows-browser.json
            ${{ runner.temp }}/release-validation/common-tool-*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  producer:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.19.0
      # Reuse setup-node's lock-keyed npm download cache; npm ci still verifies
      # package-lock integrity and builds a fresh node_modules tree.
      - run: npm ci --prefer-offline
      - id: media-cache-key
        name: Bind public image cache to source and toolchain
        run: npm run ci:media-cache:key
      - id: media-cache-restore
        name: Restore public derived images only
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.media-cache-key.outputs.key }}
          enableCrossOsArchive: false
          path: |
            .local/home-workshop-build/candidate.json
            .local/home-workshop-build/public-master
            .local/home-workshop-build/variants
            .local/home-workshop-build/mobile
            .local/home-workshop-build/social
      - name: Require exact restored cache identity
        env:
          EXPECTED_KEY: ${{ steps.media-cache-key.outputs.key }}
          MATCHED_KEY: ${{ steps.media-cache-restore.outputs.cache-matched-key }}
        run: |
          if [[ -n "$MATCHED_KEY" && "$MATCHED_KEY" != "$EXPECTED_KEY" ]]; then echo 'Unexpected image cache key'; exit 1; fi
          echo "Image cache: ${MATCHED_KEY:+exact hit}${MATCHED_KEY:-miss}; every object is validated by the normal build" >> "$GITHUB_STEP_SUMMARY"
      - name: Prebuild isolation and one public build
        env:
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
          XPOTATO_PHASE8_TEMP_ROOT: ${{ runner.temp }}/release-validation/phase8
        run: npm run release:build:hosted
      - name: Install pinned WebKit engine on the ephemeral runner
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: npx --no-install playwright install --with-deps webkit
      - name: Check the final linked home CSS in WebKit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: npm run quality:home-webkit -- --dist "$GITHUB_WORKSPACE/apps/site/dist" --out "$RUNNER_TEMP/release-validation"
      - name: Final public consumers of the same build
        env:
          XPOTATO_RELEASE_TEMP: ${{ runner.temp }}/release-validation
          XPOTATO_PHASE8_TEMP_ROOT: ${{ runner.temp }}/release-validation/phase8
        run: npm run ci:final:public
      - name: Require this attempt's independent source and private validations
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ci:hosted:gate
      - name: Verify exact public cache files before saving
        run: npm run ci:media-cache:verify
      - name: Package the already validated build
        env:
          XPOTATO_RELEASE_PACKAGE: ${{ runner.temp }}/release-package
        run: npm run release:package
      - id: upload
        name: Preserve immutable release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Save verified public derived images only
        if: steps.media-cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.media-cache-key.outputs.key }}
          enableCrossOsArchive: false
          path: |
            .local/home-workshop-build/candidate.json
            .local/home-workshop-build/public-master
            .local/home-workshop-build/variants
            .local/home-workshop-build/mobile
            .local/home-workshop-build/social
      - name: Record external identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Artifact ID: $ARTIFACT_ID; SHA-256: $ARTIFACT_DIGEST; build count: 1" >> "$GITHUB_STEP_SUMMARY"
      - name: Supplementary Lighthouse report (nonblocking, final dist only)
        continue-on-error: true
        timeout-minutes: 8
        env:
          XPOTATO_LIGHTHOUSE_REPORT: ${{ runner.temp }}/lighthouse-report
        run: npm run quality:lighthouse
      - name: Preserve local quality reports (no public report service)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-validation/axe-*-final-dist.json
            ${{ runner.temp }}/release-validation/release-*-result.json
            ${{ runner.temp }}/release-validation/release-interaction-timing.json
            ${{ runner.temp }}/release-validation/design-roles-final-dist.json
            ${{ runner.temp }}/release-validation/article-metadata-browser.json
            ${{ runner.temp }}/release-validation/article-metadata-*.png
            ${{ runner.temp }}/release-validation/tool-style-api-browser.json
            ${{ runner.temp }}/release-validation/tool-style-api-*.png
            ${{ runner.temp }}/release-validation/project-carousel-browser.json
            ${{ runner.temp }}/release-validation/carousel-*.png
            ${{ runner.temp }}/release-validation/common-tool-workflows-browser.json
            ${{ runner.temp }}/release-validation/common-tool-*.png
            ${{ runner.temp }}/release-validation/prime-offline-*.png
            ${{ runner.temp }}/release-validation/prime-offline-final-dist.json
            ${{ runner.temp }}/release-validation/prime-tool-*.json
            ${{ runner.temp }}/release-validation/prime-site-*.json
            ${{ runner.temp }}/release-validation/prime-site-*.png
            ${{ runner.temp }}/release-validation/home-*.png
            ${{ runner.temp }}/release-validation/home-photo-final-dist.json
            ${{ runner.temp }}/release-validation/home-design-webkit.json
            ${{ runner.temp }}/lighthouse-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  windows-consumer:
    needs: producer
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Consumer fixture tests (Windows PowerShell 5.1, no npm install/build)
        shell: powershell
        run: ./scripts/release/artifact/Test-ReleaseConsumer.ps1 -TempRoot "$env:RUNNER_TEMP/release-fixtures"
      - name: Linux archive to Windows staging (candidate verification only)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT_ID: ${{ needs.producer.outputs.artifact-id }}
          RELEASE_DIGEST: ${{ needs.producer.outputs.artifact-digest }}
          RELEASE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/release/artifact/Get-ReleaseArtifact.ps1 -ArtifactId $env:RELEASE_ARTIFACT_ID -ExpectedDigest "sha256:$env:RELEASE_DIGEST" -SourceSha $env:RELEASE_SOURCE -RunId $env:GITHUB_RUN_ID -RunAttempt ([int]$env:GITHUB_RUN_ATTEMPT) -OperationRoot "$env:RUNNER_TEMP/release-operation" -Mode Candidate

  result:
    if: always()
    needs: [scope, source-validation, publication-fixtures, common-tool, producer, windows-consumer]
    runs-on: ubuntu-latest
    steps:
      - name: Stable result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CORE: ${{ needs.scope.outputs.core }}
          REASON: ${{ needs.scope.outputs.reason }}
          SOURCE_RESULT: ${{ needs.source-validation.result }}
          FIXTURES_RESULT: ${{ needs.publication-fixtures.result }}
          COMMON_TOOL_RESULT: ${{ needs.common-tool.result }}
          PRODUCER_RESULT: ${{ needs.producer.result }}
          CONSUMER_RESULT: ${{ needs.windows-consumer.result }}
        run: |
          if [[ "$SCOPE_RESULT" != success ]]; then echo 'FAIL: classification/checks'; exit 1; fi
          if [[ "$CORE" == false ]]; then echo "$REASON" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [[ "$SOURCE_RESULT" != success || "$FIXTURES_RESULT" != success || "$COMMON_TOOL_RESULT" != success ]]; then echo 'FAIL: independent source, publication or Common Tool validation'; exit 1; fi
          if [[ "$PRODUCER_RESULT" != success || "$CONSUMER_RESULT" != success ]]; then echo 'FAIL: producer or Windows consumer'; exit 1; fi
          echo 'PASS: Linux build once + final validation + raw archive Windows consumer (Windows builds=0)' | tee -a "$GITHUB_STEP_SUMMARY"
