name: Temporary Phase 6 media review amendment

on:
  push:
    branches:
      - codex/site-vnext-media-phase6

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-media-phase6
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci
      - name: Regenerate Phase 6 amended review proposal
        run: |
          npm run schema:generate
          npm run migration:media:inventory:check
          npm run migration:media:review:proposal
          npm run migration:media:review:proposal:check
          npm run test
          npm run typecheck
      - name: Commit amended review and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6-media-review-amendment-temporary.yml
          git add docs/migration/media-review-proposal-v1.json schemas/generated/phase6-media-review-proposal.schema.json
          git commit -m "refactor: ConoHa screenshotをdeterministic diagramへ置換"
          git push origin HEAD:codex/site-vnext-media-phase6
