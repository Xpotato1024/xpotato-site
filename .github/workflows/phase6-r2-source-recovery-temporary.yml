name: Temporary Phase 6 old R2 source recovery

on:
  push:
    branches:
      - codex/site-vnext-media-phase6

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Recover exact frozen R2 semantic source read-only
        run: |
          set -euo pipefail
          legacy_commit=927d105713561309fc5e2374396f86646b5aeb2a
          git show "$legacy_commit:src/lib/site-config.ts" | grep -F 'assetsUrl: "https://assets.xpotato.net"' >/dev/null
          git show "$legacy_commit:src/content/blog/vibration-robot.mdx" | grep -F 'r2:/blog/my-first-post/GDCH3152.JPG' >/dev/null
          mkdir -p .local/migration/phase6/r2-recovery
          url='https://assets.xpotato.net/blog/my-first-post/GDCH3152.JPG'
          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 2 \
            --retry-all-errors \
            --silent \
            --show-error \
            --dump-header .local/migration/phase6/r2-recovery/headers.txt \
            --output .local/migration/phase6/r2-recovery/GDCH3152.JPG \
            "$url"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import sharp from 'sharp';
          import { createHash } from 'node:crypto';
          const path = '.local/migration/phase6/r2-recovery/GDCH3152.JPG';
          const bytes = await readFile(path);
          if (bytes.length === 0) throw new Error('Recovered source is empty');
          const metadata = await sharp(bytes, { failOn: 'error' }).metadata();
          if (!metadata.width || !metadata.height || !metadata.format) throw new Error('Recovered source is not a valid raster image');
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          const evidence = {
            schemaVersion: 1,
            sourceLocator: 'r2:/blog/my-first-post/GDCH3152.JPG',
            resolvedReadOnlyUrl: 'https://assets.xpotato.net/blog/my-first-post/GDCH3152.JPG',
            sourceSha256: sha256,
            sizeBytes: bytes.length,
            detectedFormat: metadata.format,
            width: metadata.width,
            height: metadata.height,
            orientation: metadata.orientation ?? null,
            hasProfile: Boolean(metadata.icc),
            providerMutationPerformed: false,
          };
          await writeFile('.local/migration/phase6/r2-recovery/evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-old-r2-hero-recovery
          path: .local/migration/phase6/r2-recovery
          if-no-files-found: error
          retention-days: 7
