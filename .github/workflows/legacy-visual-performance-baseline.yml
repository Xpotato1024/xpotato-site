name: Legacy visual and performance baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - ".node-version"
      - "package-lock.json"
      - "scripts/conditional-scope.mjs"
      - ".github/workflows/legacy-visual-performance-baseline.yml"
      - "packages/site-validators/src/legacy-visual-performance-cli.ts"
      - "tests/fixtures/migration/legacy-visual-performance-baseline.json"
      - "docs/migration/legacy-visual-performance-baseline-2026-08-29.md"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select affected conditional validation
        id: scope
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/conditional-scope.mjs .github/workflows/legacy-visual-performance-baseline.yml migration:legacy:baseline:capture
      - name: Pin npm toolchain
        if: steps.scope.outputs.required == 'true'
        run: npm install --global npm@11.19.0
      - name: Install vNext dependencies
        if: steps.scope.outputs.required == 'true'
        run: npm ci
      - name: Capture frozen legacy baseline
        if: steps.scope.outputs.required == 'true'
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run migration:legacy:baseline:capture
      - name: Upload Phase 1B evidence
        if: always() && steps.scope.outputs.required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-visual-performance-baseline
          path: .local/migration/legacy-pre-vnext-2026-08-28/phase1b/
          if-no-files-found: error
          retention-days: 90
