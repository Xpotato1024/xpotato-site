name: Temporary P2 docs sync

on:
  push:
    branches:
      - codex/site-vnext-legacy-reproduction-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-legacy-reproduction-contract
      - name: Patch stale lifecycle prose
        run: python scripts/p2_docs_sync_temp.py
      - name: Commit synchronized docs
        run: |
          if git diff --quiet -- docs/operations/validation.md docs/migration/greenfield-rebuild-plan.md; then
            echo "No documentation changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/validation.md docs/migration/greenfield-rebuild-plan.md
          git commit -m "docs: Phase 1A accepted lifecycleを同期"
          git push origin HEAD:codex/site-vnext-legacy-reproduction-contract
