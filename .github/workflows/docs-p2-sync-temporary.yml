name: Temporary P2 docs sync

on:
  push:
    branches:
      - codex/site-vnext-legacy-reproduction-contract

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stale lifecycle prose
        run: python scripts/p2_docs_sync_temp.py
      - uses: actions/upload-artifact@v4
        with:
          name: p2-docs-synced
          path: |
            docs/operations/validation.md
            docs/migration/greenfield-rebuild-plan.md
          if-no-files-found: error
