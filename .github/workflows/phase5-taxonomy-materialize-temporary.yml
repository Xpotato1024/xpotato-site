name: Temporary Phase 5 taxonomy materialization

on:
  push:
    branches:
      - codex/site-vnext-taxonomy-phase5

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-taxonomy-phase5
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Phase 5 schemas and taxonomy overlay
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm run schema:generate
          npm run migration:taxonomy:inventory:check
          npm run migration:taxonomy:review:check
          npm run migration:content:materialization:evidence:check
          npm run migration:taxonomy:materialize
          npm run migration:taxonomy:materialization:check
          npm run typecheck
          npm run validate:repository
          npm run astro:check
          npm run build
          npm run validate:static
          git diff --check
      - name: Commit Phase 5 overlay and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase5-taxonomy-materialize-temporary.yml
          git add \
            apps/site/src/content \
            apps/site/src/content-registry/taxonomy/index.ts \
            apps/site/src/content-registry/taxonomy/phase5-generated.ts \
            docs/migration/taxonomy-materialization-v1.json \
            schemas/generated
          git commit -m "feat: Phase 5 taxonomy overlayをmaterialize"
          git push origin HEAD:codex/site-vnext-taxonomy-phase5
