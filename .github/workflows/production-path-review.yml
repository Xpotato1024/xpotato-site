name: Production path design checks (no deployment)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Verify approval boundary and synthetic safety failure paths (no credentials)
        run: node --test scripts/release/environment-approval.test.mjs scripts/release/deployment-policy.test.mjs scripts/release/deployment-persistent-policy.test.mjs scripts/release/deployment-adapters.test.mjs scripts/release/site-integrity-monitor.test.mjs scripts/release/site-monitor-readiness.test.mjs scripts/release/site-domain-evidence.test.mjs scripts/release/site-monitor-conditions.test.mjs scripts/release/site-monitor-candidate.test.mjs
