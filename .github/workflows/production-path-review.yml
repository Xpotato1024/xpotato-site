name: Nondeployment Environment boundary checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Verify secret-free approval boundary and blocked production
        run: node --test scripts/release/environment-approval.test.mjs
