name: Temporary Phase 6 accepted R2 semantic correction

on:
  push:
    branches:
      - codex/site-vnext-media-phase6

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/site-vnext-media-phase6
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply operator-accepted semantic correction
        run: |
          python - <<'PY'
          from pathlib import Path

          # Contract: add an explicit rationale for recovered but editorially non-semantic legacy media.
          contract = Path("packages/content-contracts/src/phase6-media.ts")
          text = contract.read_text(encoding="utf-8")
          old = '''      "missing_generic_placeholder",\n      "nonlocal_legacy_hero_source",\n'''
          new = '''      "missing_generic_placeholder",\n      "nonlocal_legacy_hero_source",\n      "recovered_nonsemantic_legacy_hero_replaced",\n'''
          if text.count(old) != 1:
              raise SystemExit(f"unexpected Phase 6 rationale enum occurrence count: {text.count(old)}")
          contract.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          # Review generator: retire the recovered connectivity-test cat image from publication semantics.
          review = Path("packages/site-validators/src/phase6-media-review.ts")
          text = review.read_text(encoding="utf-8")
          old = '''  if (record.legacyLocator === "r2:/blog/my-first-post/GDCH3152.JPG") {\n    if (bindings.length !== 1) throw new Error("vibration-robot nonlocal hero must bind exactly one content item");\n    return {\n      legacyLocator: record.legacyLocator,\n      disposition: "recover_nonlocal_source",\n      mediaKindCandidate: "photo",\n      rightsBasisCandidate: "self_created",\n      rightsReviewStatus: "pending_human_review",\n      publicationAuthorized: false,\n      assetPlans: [planForBinding(record, bindings[0]!, {\n        assetId: "hero",\n        role: "hero",\n        alsoUsedInline: true,\n        sourceAction: "recover_nonlocal_source",\n        ingestProfileId: canonicalRaster,\n        variantProfileId: "photo-hero-v1",\n      })],\n      rationale: "nonlocal_legacy_hero_source",\n    };\n  }\n'''
          new = '''  if (record.legacyLocator === "r2:/blog/my-first-post/GDCH3152.JPG") {\n    if (bindings.length !== 1) throw new Error("vibration-robot recovered connectivity-test image must bind exactly one content item");\n    return {\n      legacyLocator: record.legacyLocator,\n      disposition: "replace_with_deterministic_cover",\n      mediaKindCandidate: "deterministic_cover",\n      rightsBasisCandidate: "self_created",\n      rightsReviewStatus: "pending_human_review",\n      publicationAuthorized: false,\n      assetPlans: [planForBinding(record, bindings[0]!, {\n        assetId: "hero",\n        role: "hero",\n        sourceAction: "generate_deterministic",\n        ingestProfileId: "diagram-svg-v1",\n      })],\n      rationale: "recovered_nonsemantic_legacy_hero_replaced",\n    };\n  }\n'''
          if text.count(old) != 1:
              raise SystemExit("R2 legacy review decision block did not match exactly once")
          text = text.replace(old, new)

          old = '''  const legacyHeroLocator = "r2:/blog/my-first-post/GDCH3152.JPG";\n  const blogPublicationPlans = phase4.records\n    .filter((record) => record.collection === "blog" && !record.sourceDraft)\n    .map((record) => ({\n      legacyContentId: record.legacyContentId,\n      contentId: record.vNextContentId,\n      targetPath: record.targetPath,\n      hero: record.legacyContentId === "blog:vibration-robot"\n        ? { assetId: "hero" as const, origin: "legacy_media" as const, sourceLocator: legacyHeroLocator }\n        : { assetId: "hero" as const, origin: "deterministic_cover" as const },\n      socialCard: { assetId: "social-card" as const, origin: "deterministic_cover" as const, variantProfileId: "social-card-v1" as const },\n      reviewStatus: "pending_human_review" as const,\n      publicationStatus: "blocked" as const,\n    }))\n    .sort((left, right) => compareCanonicalKeys(left.legacyContentId, right.legacyContentId));\n  if (blogPublicationPlans.length !== 44) throw new Error(`Phase 6 publication plan requires exactly 44 historically published Blogs, got ${blogPublicationPlans.length}`);\n  const vibrationPlan = blogPublicationPlans.find((plan) => plan.legacyContentId === "blog:vibration-robot");\n  if (!vibrationPlan || vibrationPlan.hero.origin !== "legacy_media") throw new Error("vibration-robot legacy hero plan missing");\n  const deterministicHeroCount = blogPublicationPlans.filter((plan) => plan.hero.origin === "deterministic_cover").length;\n  if (deterministicHeroCount !== 43) throw new Error(`Expected 43 deterministic Blog hero replacements, got ${deterministicHeroCount}`);\n'''
          new = '''  const blogPublicationPlans = phase4.records\n    .filter((record) => record.collection === "blog" && !record.sourceDraft)\n    .map((record) => ({\n      legacyContentId: record.legacyContentId,\n      contentId: record.vNextContentId,\n      targetPath: record.targetPath,\n      hero: { assetId: "hero" as const, origin: "deterministic_cover" as const },\n      socialCard: { assetId: "social-card" as const, origin: "deterministic_cover" as const, variantProfileId: "social-card-v1" as const },\n      reviewStatus: "pending_human_review" as const,\n      publicationStatus: "blocked" as const,\n    }))\n    .sort((left, right) => compareCanonicalKeys(left.legacyContentId, right.legacyContentId));\n  if (blogPublicationPlans.length !== 44) throw new Error(`Phase 6 publication plan requires exactly 44 historically published Blogs, got ${blogPublicationPlans.length}`);\n  const vibrationPlan = blogPublicationPlans.find((plan) => plan.legacyContentId === "blog:vibration-robot");\n  if (!vibrationPlan || vibrationPlan.hero.origin !== "deterministic_cover") throw new Error("vibration-robot deterministic hero plan missing");\n  const deterministicHeroCount = blogPublicationPlans.filter((plan) => plan.hero.origin === "deterministic_cover").length;\n  if (deterministicHeroCount !== 44) throw new Error(`Expected 44 deterministic Blog hero replacements, got ${deterministicHeroCount}`);\n'''
          if text.count(old) != 1:
              raise SystemExit("Blog publication plan block did not match exactly once")
          review.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          # Candidate expected deterministic sources rises by one.
          candidate = Path("packages/site-validators/src/phase6-media-candidate.ts")
          text = candidate.read_text(encoding="utf-8")
          old = 'if (deterministic.records.length !== 88) throw new Error(`Expected 88 deterministic SVG sources, got ${deterministic.records.length}`);'
          new = 'if (deterministic.records.length !== 89) throw new Error(`Expected 89 deterministic SVG sources, got ${deterministic.records.length}`);'
          if text.count(old) != 1:
              raise SystemExit("candidate deterministic source assertion did not match")
          candidate.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          # Local processing must now close all 101 semantic assets without a nonlocal defer.
          processing = Path("packages/site-validators/src/phase6-media-processing.ts")
          text = processing.read_text(encoding="utf-8")
          old = '''  if (records.length !== 101 || processedAssetCount !== 100 || deferredAssetCount !== 1) {\n'''
          new = '''  if (records.length !== 101 || processedAssetCount !== 101 || deferredAssetCount !== 0) {\n'''
          if text.count(old) != 1:
              raise SystemExit("processing coverage assertion did not match")
          processing.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          # Mark the exact proposal accepted; authority is recorded separately below after the new review hash exists.
          proposal = Path("docs/migration/phase6-r2-hero-semantic-correction-proposal-2026-09-04.md")
          text = proposal.read_text(encoding="utf-8")
          if not text.startswith("---\nstatus: proposed\n"):
              raise SystemExit("semantic correction proposal is not in proposed state")
          proposal.write_text(text.replace("---\nstatus: proposed\n", "---\nstatus: accepted\n", 1), encoding="utf-8", newline="\n")
          PY

      - name: Pin npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci

      - name: Generate corrected review and exact hash
        run: |
          npm run schema:generate
          npm run migration:media:inventory:check
          npm run migration:media:review:proposal
          npm run migration:media:review:proposal:check
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const review = JSON.parse(await readFile('docs/migration/media-review-proposal-v1.json', 'utf8'));
          const r2 = review.decisions.find((item) => item.legacyLocator === 'r2:/blog/my-first-post/GDCH3152.JPG');
          if (!r2) throw new Error('corrected R2 review decision missing');
          if (r2.disposition !== 'replace_with_deterministic_cover') throw new Error(`unexpected R2 disposition: ${r2.disposition}`);
          if (r2.rationale !== 'recovered_nonsemantic_legacy_hero_replaced') throw new Error(`unexpected R2 rationale: ${r2.rationale}`);
          if (r2.assetPlans.length !== 1 || r2.assetPlans[0].sourceAction !== 'generate_deterministic' || r2.assetPlans[0].ingestProfileId !== 'diagram-svg-v1') {
            throw new Error('corrected R2 deterministic asset plan mismatch');
          }
          const legacyHeroes = review.blogPublicationPlans.filter((item) => item.hero.origin === 'legacy_media');
          const deterministicHeroes = review.blogPublicationPlans.filter((item) => item.hero.origin === 'deterministic_cover');
          if (legacyHeroes.length !== 0 || deterministicHeroes.length !== 44) throw new Error(`Blog hero coverage mismatch: legacy=${legacyHeroes.length}; deterministic=${deterministicHeroes.length}`);
          console.log(`NEW_REVIEW_SHA=${review.reviewPayloadSha256}`);
          await import('node:fs/promises').then(({ appendFile }) => appendFile(process.env.GITHUB_ENV, `NEW_REVIEW_SHA=${review.reviewPayloadSha256}\n`));
          NODE

      - name: Bind new operator acceptance hash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          new_hash = os.environ["NEW_REVIEW_SHA"]
          old_hash = "f257ad5f2de8bc89afbb245c94bca60c820b7df725e81d372e634517727bba70"

          candidate = Path("packages/site-validators/src/phase6-media-candidate.ts")
          text = candidate.read_text(encoding="utf-8")
          old = f'export const PHASE6_ACCEPTED_MEDIA_REVIEW_SHA256 = "{old_hash}";'
          new = f'export const PHASE6_ACCEPTED_MEDIA_REVIEW_SHA256 = "{new_hash}";'
          if text.count(old) != 1:
              raise SystemExit("accepted review hash binding did not match")
          text = text.replace(old, new)
          old_time = 'const confirmedAt = "2026-09-04T02:22:00+09:00" as const;'
          if old_time in text:
              text = text.replace(old_time, 'const confirmedAt = "2026-09-04T03:45:00+09:00" as const;')
          else:
              old_time = 'const confirmedAt = "2026-09-04T02:22:00+09:00";'
              if text.count(old_time) != 1:
                  raise SystemExit("candidate confirmation timestamp did not match")
              text = text.replace(old_time, 'const confirmedAt = "2026-09-04T03:45:00+09:00";')
          candidate.write_text(text, encoding="utf-8", newline="\n")

          acceptance = Path("docs/migration/phase6-media-review-acceptance-2026-09-04.md")
          text = acceptance.read_text(encoding="utf-8")
          old_bullet = '- `r2:/blog/my-first-post/GDCH3152.JPG` remains a source-recovery candidate for the vibration-robot hero/inline semantic asset;'
          new_bullet = '- recovered `r2:/blog/my-first-post/GDCH3152.JPG` is retained only as historical recovery evidence and is excluded from the vNext canonical/public/Media Registry publication set;'
          if text.count(old_bullet) != 1:
              raise SystemExit("old R2 acceptance bullet did not match")
          text = text.replace(old_bullet, new_bullet)
          old_blog = '- historically published Blogs receive the reviewed hero/social-card plan: one hero and one deterministic social card per Blog, with the vibration-robot hero retaining its reviewed legacy-source recovery path and other missing Blog heroes using deterministic covers.'
          new_blog = '- all 44 historically published Blogs receive one deterministic hero cover and one deterministic social card; `blog:vibration-robot` no longer depends on a nonlocal legacy hero.'
          if text.count(old_blog) != 1:
              raise SystemExit("old Blog publication acceptance bullet did not match")
          text = text.replace(old_blog, new_blog)
          old_bound = f'This acceptance is exact-hash-bound to `{old_hash}`. A later review-payload change requires new operator acceptance.'
          new_bound = f'The Project overview profile-correction acceptance above was exact-hash-bound to `{old_hash}`. It is superseded only by the separately accepted R2 semantic correction below.'
          if text.count(old_bound) != 1:
              raise SystemExit("old exact-hash-bound sentence did not match")
          text = text.replace(old_bound, new_bound)

          section = f'''## Old R2 hero semantic correction acceptance\n\nThe operator explicitly accepted `docs/migration/phase6-r2-hero-semantic-correction-proposal-2026-09-04.md` after read-only recovery and visual inspection of the exact frozen `r2:/blog/my-first-post/GDCH3152.JPG` object.\n\n```text\naccepted correction proposal pre-acceptance Git blob SHA: 5cd64675a3e44c7c4564f0b530128c202c038b04\nrecovered source SHA-256: b64e664b30e8c980bdaa3dfd34a52d6b61dbf1a5c8e202c8de15943dcff84d54\nrecovered source: JPEG 3024 x 4032, 1420500 bytes\nrecovery Actions artifact id: 9907188289\nrecovery artifact digest: sha256:d289ce99daf895c04073347eb2626f5f7d2f25ac102e0ac3e599d2ed271a1a40\nprevious effective review payload: {old_hash}\ncorrection: retire recovered connectivity-test cat image from publication semantics; use deterministic cover for blog:vibration-robot hero\ncurrent effective accepted review payload: {new_hash}\noperator acceptance time: 2026-09-04T03:45:00+09:00\n```\n\nThe recovered JPEG remains evidence only; it is not a vNext canonical source, public delivery object, protected-copy candidate, or Media Registry publication asset. The three content-relevant Git-backed `vibration-robot` body photos remain unchanged. No historical robot image is fabricated.\n\nThis acceptance is exact-hash-bound to `{new_hash}`. A later review-payload change requires new operator acceptance.\n\n'''
          marker = "## Safety boundary\n"
          if text.count(marker) != 1:
              raise SystemExit("Safety boundary marker did not match")
          text = text.replace(marker, section + marker)
          acceptance.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Regenerate candidate and close local processing coverage
        run: |
          npm run schema:generate
          npm run migration:media:review:proposal:check
          npm run migration:media:candidate
          npm run migration:media:candidate:check
          npm run migration:media:processing
          npm run migration:media:processing:check
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const candidate = JSON.parse(await readFile('docs/migration/media-repository-candidate-v1.json', 'utf8'));
          const processing = JSON.parse(await readFile('docs/migration/media-local-processing-v1.json', 'utf8'));
          if (candidate.deterministicSources.length !== 89) throw new Error(`deterministic source count=${candidate.deterministicSources.length}`);
          const nonlocal = candidate.provenance.filter((item) => item.origin === 'legacy_nonlocal_recovery');
          if (nonlocal.length !== 0) throw new Error(`nonlocal provenance remains=${nonlocal.length}`);
          const recoveryBlockers = candidate.processingPlan.filter((item) => item.blockers.includes('nonlocal_source_recovery'));
          if (recoveryBlockers.length !== 0) throw new Error(`nonlocal recovery blockers remain=${recoveryBlockers.length}`);
          if (processing.semanticAssetCount !== 101 || processing.processedAssetCount !== 101 || processing.deferredAssetCount !== 0) {
            throw new Error(`processing coverage ${processing.processedAssetCount}/${processing.semanticAssetCount}; deferred=${processing.deferredAssetCount}`);
          }
          if (processing.records.some((item) => item.status !== 'processed' || item.blockers.length !== 0)) throw new Error('processed manifest still contains deferred/blocked asset');
          console.log(`FINAL_CANDIDATE_SHA=${candidate.manifestPayloadSha256}`);
          console.log(`FINAL_PROCESSING_SHA=${processing.manifestPayloadSha256}`);
          NODE

      - name: Validate full repository
        run: |
          npm run ci
          git diff --check

      - name: Upload corrected local processing bytes
        uses: actions/upload-artifact@v4
        with:
          name: phase6-local-media-processing-r2-corrected
          path: .local/migration/phase6/processing-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Commit accepted correction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6-r2-semantic-correction-temporary.yml
          git add \
            packages/content-contracts/src/phase6-media.ts \
            packages/site-validators/src/phase6-media-review.ts \
            packages/site-validators/src/phase6-media-candidate.ts \
            packages/site-validators/src/phase6-media-processing.ts \
            docs/migration/media-review-proposal-v1.json \
            docs/migration/media-repository-candidate-v1.json \
            docs/migration/media-local-processing-v1.json \
            docs/migration/phase6-media-review-acceptance-2026-09-04.md \
            docs/migration/phase6-r2-hero-semantic-correction-proposal-2026-09-04.md \
            schemas/generated/phase6-media-review-proposal.schema.json \
            schemas/generated/phase6-media-local-processing-manifest.schema.json
          git commit -m "fix: recovered R2 test imageをdeterministic heroへ置換"
          git push origin HEAD:codex/site-vnext-media-phase6
