<svg xmlns="http://www.w3.org/2000/svg" width="360" height="746" viewBox="0 0 360 746" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">人とAIが同じ原稿を育てる流れ</title><desc id="figure-description">人がCMSで編集する経路とAIエージェントが執筆する経路は、同じMDXとcontent作業ブランチを共有する。内容・図・表示を確認し、指摘があれば改稿する。本人確認後に正式な媒体保存・export・PRへ進み、本番配信には別の公開判断を置く。CMSからAIの自動起動は未接続で、引継ぎは手動。</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="rgb(116, 83, 153)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="360" height="746" fill="#faf9f7"/><rect x="14" y="14" width="158" height="130" rx="12" fill="#fff" stroke="rgb(116, 83, 153)" stroke-width="1.5"/><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" x="65" y="24" width="56" height="56.00000">
