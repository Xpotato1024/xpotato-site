<svg xmlns="http://www.w3.org/2000/svg" width="360" height="598" viewBox="0 0 360 598" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">下書きと公開媒体の保存先</title><desc id="figure-description">制作中のDraft画像は本人限定の別領域に置く。本人確認後の正式工程で、正規化済み原本を非公開のAへ、配信用データを公開のBへ保存し、実際に公開するbytesを別保存先のCへ保護する。CMSにA・B・Cへの直接操作権限を持たせない。</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="rgb(116, 83, 153)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="360" height="598" fill="#faf9f7"/><rect x="24" y="14" width="312" height="90" rx="12" fill="#fff" stroke="#d8d4dc" stroke-width="1.5" stroke-dasharray="5 5"/><g transform="translate(39 37) scale(1)" fill="none" stroke="rgb(116, 83, 153)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="26" height="24" rx="3"/><circle cx="11" cy="11" r="3"/><path d="m5 26 8-9 5 5 5-8 6 9"/></g><text x="86" y="49" font-size="20" font-weight="500" text-anchor="start" fill="#15141d">Draft：制作中の画像</text><text x="180" y="82" font-size="18" font-weight="400" text-anchor="middle" fill="#15141d">本人限定・公開系と分離</text><path d="M28 128 H332" fill="none" stroke="#d8d4dc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="180" y="159" font-size="18" font-weight="400" text-anchor="middle" fill="#625e6e">本人確認後の正式保存</text><rect x="32" y="182" width="296" height="94" rx="12" fill="#fff" stroke="rgb(116, 83, 153)" stroke-width="1.5"/><g transform="translate(49 211) scale(1.03125)" fill="none" stroke="rgb(116, 83, 153)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h12l7 7v19H7zM19 3v8h7M11 17h11m-11 6h8"/></g><text x="101" y="215" font-size="20" font-weight="500" text-anchor="start" fill="#15141d">A  正規化済み原本</text><text x="101" y="247" font-size="18" font-weight="400" text-anchor="start" fill="#15141d">非公開／再変換に使う</text><path d="M180 276 V284" fill="none" stroke="rgb(116, 83, 153)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="306" font-size="18" font-weight="400" text-anchor="middle" fill="#625e6e">配信用に変換</text><path d="M180 315 V332" fill="none" stroke="rgb(116, 83, 153)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="332" width="296" height="94" rx="12" fill="#fff" stroke="rgb(116, 83, 153)" stroke-width="1.5"/><g transform="translate(49 361) scale(1.03125)" fill="none" stroke="rgb(116, 83, 153)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="26" height="24" rx="3"/><circle cx="11" cy="11" r="3"/><path d="m5 26 8-9 5 5 5-8 6 9"/></g><text x="101" y="365" font-size="20" font-weight="500" text-anchor="start" fill="#15141d">B  配信用データ</text><text x="101" y="397" font-size="18" font-weight="400" text-anchor="start" fill="#15141d">公開／読者へ届ける</text><path d="M180 426 V434" fill="none" stroke="rgb(116, 83, 153)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="456" font-size="18" font-weight="400" text-anchor="middle" fill="#625e6e">公開した画像をそのまま保護</text><path d="M180 465 V482" fill="none" stroke="rgb(116, 83, 153)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="482" width="296" height="100" rx="12" fill="#fff" stroke="#d8d4dc" stroke-width="1.5"/><g transform="translate(49 513) scale(1.03125)" fill="none" stroke="rgb(116, 83, 153)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3 28 8v9c0 7-12 13-12 13S4 24 4 17V8z"/><path d="m10 16 4 4 8-9"/></g><text x="101" y="516" font-size="20" font-weight="500" text-anchor="start" fill="#15141d">C  公開画像の保護</text><text x="101" y="547" font-size="18" font-weight="400" text-anchor="start" fill="#15141d">別の保存先／復旧用</text></svg>
